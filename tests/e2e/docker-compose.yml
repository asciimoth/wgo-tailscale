services:
  certgen:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for name in headscale headscale-alpha headscale-beta; do
          mkdir -p "/state/$$name"
          if [ ! -s "/state/$$name/tls.crt" ]; then
            openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
              -subj "/CN=$$name" \
              -addext "subjectAltName=DNS:$$name" \
              -keyout "/state/$$name/tls.key" \
              -out "/state/$$name/tls.crt"
          fi
          chmod 600 "/state/$$name/tls.key"
        done
    volumes:
      - ./.state:/state

  headscale:
    image: headscale/headscale:v0.29.3
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - ./.state/headscale:/var/lib/headscale
      - ./.state/run:/var/run/headscale
    ports:
      - "18443:8443"
      - "13478:3478/udp"

  headscale-alpha:
    image: headscale/headscale:v0.29.3
    command: serve
    volumes:
      - ./headscale/config-alpha.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - ./.state/headscale-alpha:/var/lib/headscale
      - ./.state/run-alpha:/var/run/headscale

  headscale-beta:
    image: headscale/headscale:v0.29.3
    command: serve
    volumes:
      - ./headscale/config-beta.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - ./.state/headscale-beta:/var/lib/headscale
      - ./.state/run-beta:/var/run/headscale

  registrar:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/bin/sh", "/scripts/register.sh"]
    depends_on:
      headscale:
        condition: service_started
    environment:
      TEST_NODES: derp-a derp-b stun-a stun-b local-a local-b mixed-wgo
      PREAUTHKEY_NODES: mixed-official
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/register.sh:/scripts/register.sh:ro
      - ./.state/headscale:/var/lib/headscale
      - ./.state/run:/var/run/headscale
      - ./.state:/state

  registrar-alpha:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/bin/sh", "/scripts/register.sh"]
    depends_on:
      headscale-alpha:
        condition: service_started
    environment:
      TEST_NODES: multi-a-alpha multi-c-alpha
      REGISTRAR_SUCCESS: registrar-alpha.success
    volumes:
      - ./headscale/config-alpha.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/register.sh:/scripts/register.sh:ro
      - ./.state/headscale-alpha:/var/lib/headscale
      - ./.state/run-alpha:/var/run/headscale
      - ./.state:/state

  registrar-beta:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/bin/sh", "/scripts/register.sh"]
    depends_on:
      headscale-beta:
        condition: service_started
    environment:
      TEST_NODES: multi-b-beta multi-c-beta
      REGISTRAR_SUCCESS: registrar-beta.success
    volumes:
      - ./headscale/config-beta.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/register.sh:/scripts/register.sh:ro
      - ./.state/headscale-beta:/var/lib/headscale
      - ./.state/run-beta:/var/run/headscale
      - ./.state:/state

  derp-a:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      headscale:
        condition: service_started
    environment:
      SCENARIO_ID: derp-tunnel
      NODE_NAME: derp-a
      OTHER_NODE: derp-b
      NODE_PRIVATE_HEX: "7777777777777777777777777777777777777777777777777777777777777777"
      OTHER_NODE_PRIVATE_HEX: "8888888888888888888888888888888888888888888888888888888888888888"
      CONTROL_URL: https://headscale:8443
      INSECURE_TLS: "1"
      DISABLE_DISCOVERY: "1"
      EXPECT_PATH: derp-tls
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  derp-b:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      headscale:
        condition: service_started
    environment:
      SCENARIO_ID: derp-tunnel
      NODE_NAME: derp-b
      OTHER_NODE: derp-a
      NODE_PRIVATE_HEX: "8888888888888888888888888888888888888888888888888888888888888888"
      OTHER_NODE_PRIVATE_HEX: "7777777777777777777777777777777777777777777777777777777777777777"
      CONTROL_URL: https://headscale:8443
      INSECURE_TLS: "1"
      DISABLE_DISCOVERY: "1"
      EXPECT_PATH: derp-tls
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  stun-a:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      headscale:
        condition: service_started
    environment:
      SCENARIO_ID: stun-nat
      NODE_NAME: stun-a
      OTHER_NODE: stun-b
      NODE_PRIVATE_HEX: "3333333333333333333333333333333333333333333333333333333333333333"
      OTHER_NODE_PRIVATE_HEX: "4444444444444444444444444444444444444444444444444444444444444444"
      CONTROL_URL: https://headscale:8443
      INSECURE_TLS: "1"
      DISABLE_DERP: "1"
      EXPECT_PATH: direct-udp
      REQUIRE_DERP_STUN_NODE: "1"
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  stun-b:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      headscale:
        condition: service_started
    environment:
      SCENARIO_ID: stun-nat
      NODE_NAME: stun-b
      OTHER_NODE: stun-a
      NODE_PRIVATE_HEX: "4444444444444444444444444444444444444444444444444444444444444444"
      OTHER_NODE_PRIVATE_HEX: "3333333333333333333333333333333333333333333333333333333333333333"
      CONTROL_URL: https://headscale:8443
      INSECURE_TLS: "1"
      DISABLE_DERP: "1"
      EXPECT_PATH: direct-udp
      REQUIRE_DERP_STUN_NODE: "1"
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  local-a:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      headscale:
        condition: service_started
    environment:
      SCENARIO_ID: local-discovery
      NODE_NAME: local-a
      OTHER_NODE: local-b
      NODE_PRIVATE_HEX: "5555555555555555555555555555555555555555555555555555555555555555"
      OTHER_NODE_PRIVATE_HEX: "6666666666666666666666666666666666666666666666666666666666666666"
      CONTROL_URL: https://headscale:8443
      INSECURE_TLS: "1"
      DISABLE_DERP: "1"
      EXPECT_PATH: direct-udp
      REQUIRE_ENDPOINT_SOURCE: local
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  local-b:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      headscale:
        condition: service_started
    environment:
      SCENARIO_ID: local-discovery
      NODE_NAME: local-b
      OTHER_NODE: local-a
      NODE_PRIVATE_HEX: "6666666666666666666666666666666666666666666666666666666666666666"
      OTHER_NODE_PRIVATE_HEX: "5555555555555555555555555555555555555555555555555555555555555555"
      CONTROL_URL: https://headscale:8443
      INSECURE_TLS: "1"
      DISABLE_DERP: "1"
      EXPECT_PATH: direct-udp
      REQUIRE_ENDPOINT_SOURCE: local
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  mixed-wgo:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/usr/local/bin/e2e-vtun-server"]
    depends_on:
      headscale:
        condition: service_started
    environment:
      NODE_NAME: mixed-wgo
      OFFICIAL_NODE: mixed-official
      NODE_PRIVATE_HEX: "9999999999999999999999999999999999999999999999999999999999999999"
      CONTROL_URL: https://headscale:8443
      INSECURE_TLS: "1"
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  mixed-official:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.tailscale
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    depends_on:
      headscale:
        condition: service_started
      registrar:
        condition: service_started
      mixed-wgo:
        condition: service_started
    environment:
      NODE_NAME: mixed-official
      WGO_NODE: mixed-wgo
      CONTROL_URL: https://headscale:8443
      STATE_DIR: /state
    volumes:
      - ./.state:/state
      - ./tailscale-client/run.sh:/scripts/run.sh:ro

  multi-a:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/usr/local/bin/e2e-multi-node"]
    depends_on:
      headscale-alpha:
        condition: service_started
    environment:
      NODE_NAME: multi-a
      NODE_PRIVATE_HEX: "1212121212121212121212121212121212121212121212121212121212121212"
      CONTROLLERS: alpha,https://headscale-alpha:8443,tailscale-alpha
      PEERS: alpha,multi-c,1414141414141414141414141414141414141414141414141414141414141414
      INSECURE_TLS: "1"
      DISABLE_DERP: "1"
      EXPECT_PATH: direct-udp
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  multi-b:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/usr/local/bin/e2e-multi-node"]
    depends_on:
      headscale-beta:
        condition: service_started
    environment:
      NODE_NAME: multi-b
      NODE_PRIVATE_HEX: "1313131313131313131313131313131313131313131313131313131313131313"
      CONTROLLERS: beta,https://headscale-beta:8443,tailscale-beta
      PEERS: beta,multi-c,1414141414141414141414141414141414141414141414141414141414141414
      INSECURE_TLS: "1"
      DISABLE_DERP: "1"
      EXPECT_PATH: direct-udp
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  multi-c:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/usr/local/bin/e2e-multi-node"]
    depends_on:
      headscale-alpha:
        condition: service_started
      headscale-beta:
        condition: service_started
    environment:
      NODE_NAME: multi-c
      NODE_PRIVATE_HEX: "1414141414141414141414141414141414141414141414141414141414141414"
      CONTROLLERS: alpha,https://headscale-alpha:8443,tailscale-alpha beta,https://headscale-beta:8443,tailscale-beta
      PEERS: alpha,multi-a,1212121212121212121212121212121212121212121212121212121212121212 beta,multi-b,1313131313131313131313131313131313131313131313131313131313131313
      INSECURE_TLS: "1"
      DISABLE_DERP: "1"
      EXPECT_PATH: direct-udp
      STATE_DIR: /state
    volumes:
      - ./.state:/state

  verifier:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        remaining=180
        while [ "$$remaining" -gt 0 ]; do
          if \
            [ -s /state/derp-a.success ] && [ -s /state/derp-b.success ] && \
            [ -s /state/stun-a.success ] && [ -s /state/stun-b.success ] && \
            [ -s /state/local-a.success ] && [ -s /state/local-b.success ] && \
            [ -s /state/mixed-wgo.success ] && [ -s /state/mixed-official.success ] && \
            [ -s /state/multi-a.success ] && [ -s /state/multi-b.success ] && [ -s /state/multi-c.success ]; then
            echo "Headscale registration, narrowed wgo traffic, official client curl, and multi-Headscale traffic passed"
            exit 0
          fi
          remaining=$$((remaining - 1))
          sleep 1
        done
        echo "timed out waiting for e2e clients" >&2
        find /state -maxdepth 1 -type f -print >&2 || true
        exit 1
    depends_on:
      registrar:
        condition: service_started
      registrar-alpha:
        condition: service_started
      registrar-beta:
        condition: service_started
      derp-a:
        condition: service_started
      derp-b:
        condition: service_started
      stun-a:
        condition: service_started
      stun-b:
        condition: service_started
      local-a:
        condition: service_started
      local-b:
        condition: service_started
      mixed-wgo:
        condition: service_started
      mixed-official:
        condition: service_started
      multi-a:
        condition: service_started
      multi-b:
        condition: service_started
      multi-c:
        condition: service_started
    volumes:
      - ./.state:/state
